[pyprland]
plugins = ["scratchpads"]

[scratchpads.term]
command = "kitty --class scratch-term -e tmux new-session -A -s scratch"
size = "60% 70%"

[scratchpads.notes]
command = "kitty --class scratch-notes nvim ~/.notes/quicknotes.md"
size = "50% 60%"

[scratchpads.music]
command = "spotube"
size = "50% 60%"

[scratchpads.serial]
command = "kitty --class scratch-serial"
size = "40% 50%"

# ==============================================================================
# KITTY CONFIG - Entorno DevOps Tokyo Night
# ~/.config/kitty/kitty.conf
# ==============================================================================

# --- FUENTES ---
# JetBrains Mono es ideal para distinguir bien caracteres en scripts y YAMLs
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- RENDIMIENTO Y WAYLAND ---
# Forzar Wayland nativo (evita que pase por XWayland)
linux_display_server wayland
# Sincronización estricta con el monitor (vital para aprovechar los 144Hz)
sync_to_monitor yes
# No recordar estado maximizado para no sobreponerse en mosaico (Tiling)
remember_window_size no
initial_window_width 940
initial_window_height 600

# --- VENTANA Y ESTÉTICA ---
# Opacidad al 88% para que el 'blur' de Hyprland haga sinergia con el fondo manga
background_opacity 0.88
dynamic_background_opacity yes

# Quitar decoraciones Wayland nativas
hide_window_decorations yes
window_padding_width 12

# --- CURSOR Y COMPORTAMIENTO ---
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Historial largo para no perder logs de compilación o redes
scrollback_lines 10000

# Copiar al portapapeles automáticamente al seleccionar texto
copy_on_select yes

# --- PALETA BERSERK MANGA NOIR & WORKFLOW CODE ---
# Fondo carbón manga y texto marfil de alta legibilidad
foreground #d5d6db
background #0c0d12
selection_foreground #ffffff
selection_background #242533

# Cursor Berserk Crimson (Marca del Sacrificio)
cursor #ff2a3a
cursor_text_color #0c0d12

# Colores estándar de sintaxis (Colores habituales y nítidos para código)
# Normal: Negro, Rojo, Verde, Amarillo, Azul, Magenta, Cian, Blanco
color0 #12131a
color1 #ff4b5c
color2 #98c379
color3 #e5c07b
color4 #61afef
color5 #c678dd
color6 #56b6c2
color7 #abb2bf

# Brillantes: Grafito, Rojo Berserk, Verde, Amarillo, Azul, Magenta, Cian, Blanco Puro
color8 #4b5263
color9 #ff2a3a
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff
# ==============================================================================
# MEJORAS DEVOPS Y WORKFLOW
# ==============================================================================

# Control Remoto (Requerido para Broadcast y scripts)
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Historial para Logs
scrollback_pager_history_size 50

# Shell Integration nativa
shell_integration enabled

# Layouts (Adiós Tmux)
enabled_layouts splits,stack,tall,grid
map ctrl+shift+enter launch --location=split
map ctrl+shift+h launch --location=hsplit
map ctrl+shift+d launch --location=vsplit
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Kittens (Superpoderes)
map f11 launch --allow-remote-control kitty +kitten broadcast

# Atajos útiles
# Ctrl+Shift+G: Muestra el output del último comando en un paginador
# Ctrl+Shift+Z: Salta al prompt anterior
# --- ESTILO DE LAS DIVISIONES (Splits) ---
# Fuerza a que se dibuje un borde completo y más grueso alrededor del panel
window_margin_width 2

# Colores del borde (Borde activo Berserk Crimson)
active_border_color #ff2a3a
inactive_border_color #232430

# --- ATENUACIÓN DE PANELES INACTIVOS ---
# Desvanece el texto de las terminales que no tienen el foco [i]
inactive_text_alpha 0.5

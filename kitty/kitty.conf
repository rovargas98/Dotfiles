# ==============================================================================
# KITTY CONFIG - Entorno DevOps Berserk Manga Noir (GPU Terminal Host para Tmux)
# ~/.config/kitty/kitty.conf -> ~/Dotfiles/kitty/kitty.conf
# ==============================================================================

# --- FUENTES ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- RENDIMIENTO Y WAYLAND ---
# Forzar Wayland nativo (GPU scanout directo, evita XWayland)
linux_display_server wayland
# Sincronización estricta con el monitor (vital para pantallas 144Hz)
sync_to_monitor yes
# Dimensiones iniciales de ventana sin forzar maximizado para tiling en Hyprland
remember_window_size no
initial_window_width 940
initial_window_height 600

# --- VENTANA Y ESTÉTICA BERSERK MANGA NOIR ---
# Opacidad al 88% para máxima sinergia con el desenfoque (blur) de Hyprland
background_opacity 0.88
dynamic_background_opacity yes

# Eliminar barras de título y decoraciones Wayland nativas
hide_window_decorations yes
window_padding_width 10

# --- CURSOR Y COMPORTAMIENTO ---
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Historial local de buffer
scrollback_lines 10000

# Copiar al portapapeles automáticamente al seleccionar texto
copy_on_select yes

# --- PALETA BERSERK MANGA NOIR & WORKFLOW ---
# Fondo carbón manga y texto marfil de alta legibilidad
foreground #d5d6db
background #0c0d12
selection_foreground #ffffff
selection_background #242533

# Cursor Berserk Crimson (Marca del Sacrificio)
cursor #ff2a3a
cursor_text_color #0c0d12

# Colores estándar de sintaxis ANSI
# Normal: Negro, Rojo, Verde, Amarillo, Azul, Magenta, Cian, Blanco
color0 #12131a
color1 #ff4b5c
color2 #98c379
color3 #e5c07b
color4 #61afef
color5 #c678dd
color6 #56b6c2
color7 #abb2bf

# Brillantes: Grafito, Rojo Berserk, Verde, Amarillo, Azul, Magenta, Cian, Blanco Puro
color8 #4b5263
color9 #ff2a3a
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff

# --- INTEGRACIÓN Y ATAJOS ---
# Shell Integration nativa
shell_integration enabled

# --- PUENTE DE MEMORIA MUSCULAR CON TMUX ---
# Mapea tus combinaciones familiares de Kitty directamente a los comandos estándar de Tmux
# (\x02 es Ctrl+B, prefijo estándar de la industria)
map ctrl+shift+enter send_text all \x02|
map ctrl+shift+d     send_text all \x02%
map ctrl+shift+h     send_text all \x02"
map ctrl+shift+z     send_text all \x02z
map f11              send_text all \x02b


# ==============================================================================
# ⚔️ TMUX DEVOPS CYBERDECK - ESTÁNDAR INDUSTRIA (Pabpereza / Vim / DevOps)
# ~/.tmux.conf / ~/Dotfiles/tmux/tmux.conf
# ==============================================================================
# Paleta de Colores Berserk Manga Noir:
# Carbono Manga: #0c0d12 | Grafito Slate: #181922 | Borde Inactivo: #232430
# Marca Berserk (Crimson): #ff2a3a | Texto Marfil: #d5d6db
# Cian Red/Cloud: #56b6c2 | Violeta: #c678dd | Jade Estado: #98c379
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PREFIJO ESTÁNDAR DE LA INDUSTRIA (Ctrl + b)
# ------------------------------------------------------------------------------
# Prefijo oficial de Tmux por defecto: Ctrl + b
set -g prefix C-b
bind C-b send-prefix

# Prefijo secundario opcional: Ctrl + a (máxima ergonomía)
set -g prefix2 C-a
bind C-a send-prefix -2

# Tiempo de escape a 0 (vital para no tener retardo con Neovim / Vim al pulsar ESC)
set -s escape-time 0

# Soporte completo de 24-bit TrueColor y eventos de foco
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm*:Tc"
set -g focus-events on

# Buffer de historial masivo para logs de servidores, Docker y compilaciones
set -g history-limit 50000

# Tiempo de visualización de mensajes (4 segundos)
set -g display-time 4000

# Frecuencia de actualización de la barra de estado (cada 5 segundos)
set -g status-interval 5

# Soporte de Ratón completo (scroll, seleccionar paneles, redimensionar bordes)
set -g mouse on

# Numeración de ventanas y paneles basada en 1 (Alineado con el teclado 1-9 y Hyprland)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Evitar renombrado automático molesto una vez asignas un nombre manual
set -g allow-rename on

# ------------------------------------------------------------------------------
# 2. GESTIÓN DE PANELES (SPLITS) - ESTÁNDAR INDUSTRIA
# ------------------------------------------------------------------------------
# Recargar configuración con Prefix + r
bind r source-file ~/.tmux.conf \; display-message "⚔️ Configuración Tmux Recargada!"

# Divisiones oficiales estándar de Tmux (% vertical, " horizontal)
# Añadimos -c "#{pane_current_path}" para conservar siempre el directorio actual
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Divisiones ergonómicas alternativas (muy comunes en dotfiles modernos)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind d split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Cerrar panel (Prefix + x)
bind x kill-pane

# Alternar pantalla completa / Zoom de panel (Prefix + z)
bind z resize-pane -Z
bind -n M-z resize-pane -Z

# Mostrar números de paneles para saltar rápido (Prefix + q)
bind q display-panes

# Ciclar entre paneles (Prefix + o)
bind o select-pane -t :.+

# Saltar al último panel activo (Prefix + ;)
bind \; last-pane

# ------------------------------------------------------------------------------
# 3. REDIMENSIÓN DE PANELES
# ------------------------------------------------------------------------------
# Redimensión estándar con flechas (Prefix + Ctrl + Flechas)
bind -r C-Up    resize-pane -U 2
bind -r C-Down  resize-pane -D 2
bind -r C-Left  resize-pane -L 2
bind -r C-Right resize-pane -R 2

# Redimensión estilo Vim en incrementos mayores (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ------------------------------------------------------------------------------
# 4. GESTIÓN DE VENTANAS (PESTAÑAS) - ESTÁNDAR INDUSTRIA
# ------------------------------------------------------------------------------
# Nueva ventana (Prefix + c) conservando directorio
bind c new-window -c "#{pane_current_path}"

# Renombrar ventana actual (Prefix + ,)
bind , command-prompt -I "#W" "rename-window '%%'"

# Cerrar ventana actual (Prefix + &)
bind & kill-window

# Navegación entre ventanas
bind n next-window
bind p previous-window
bind l last-window

# Lista interactiva de ventanas (Prefix + w) y buscador (Prefix + f)
bind w choose-tree -Zw
bind f command-prompt "find-window '%%'"

# Navegación rápida directa con Alt + Número o Alt + p / n (sin prefijo)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-p previous-window
bind -n M-n next-window

# ------------------------------------------------------------------------------
# 5. INTEGRACIÓN INTELIGENTE NEOVIM + TMUX (Vim-Tmux-Navigator)
# Permite saltar entre paneles de Neovim y Tmux con Ctrl + h/j/k/l de forma transparente
# ------------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Navegación adicional con flechas estándar (Prefix + Flechas)
bind -r Up    select-pane -U
bind -r Down  select-pane -D
bind -r Left  select-pane -L
bind -r Right select-pane -R

# ------------------------------------------------------------------------------
# 6. SUPERPODER DEVOPS: MODO BROADCAST (SYNCHRONIZE-PANES)
# Reemplazo directo de Broadcast Kitten de Kitty (F11)
# Envía los mismos comandos a todos los paneles simultáneamente
# ------------------------------------------------------------------------------
bind -n F11 set-window-option synchronize-panes \; display-message "󰓦 Modo Broadcast: #{?pane_synchronized,🔥 ACTIVADO (Enviando a todos los paneles),🛑 DESACTIVADO}"
bind b set-window-option synchronize-panes \; display-message "󰓦 Modo Broadcast: #{?pane_synchronized,🔥 ACTIVADO,🛑 DESACTIVADO}"
bind S set-window-option synchronize-panes \; display-message "󰓦 Modo Broadcast: #{?pane_synchronized,🔥 ACTIVADO,🛑 DESACTIVADO}"

# ------------------------------------------------------------------------------
# 7. MODO COPIA VI Y PORTAPAPELES WAYLAND (WL-COPY)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind [ copy-mode
bind Escape copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind P run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"

# ------------------------------------------------------------------------------
# 8. ESTÉTICA BERSERK MANGA NOIR & TELEMETRÍA DE ESTADO
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0c0d12,fg=#d5d6db"

# Bordes de paneles
set -g pane-border-style "fg=#232430,bg=default"
set -g pane-active-border-style "fg=#ff2a3a,bg=default"

# Mensajes en terminal
set -g message-style "bg=#ff2a3a,fg=#0c0d12,bold"
set -g message-command-style "bg=#181922,fg=#d5d6db"

# Menús y modo de selección
setw -g mode-style "bg=#ff2a3a,fg=#0c0d12,bold"

# Formato Izquierda: Nombre de Sesión
set -g status-left-length 50
set -g status-left "#[bg=#ff2a3a,fg=#0c0d12,bold] 󰕮 #S #[bg=#181922,fg=#ff2a3a]#[default] "

# Formato de Ventanas / Pestañas
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#71717a,bg=#181922] #I  #W #[fg=#181922,bg=#0c0d12]"
setw -g window-status-current-format "#[fg=#181922,bg=#ff2a3a]#[fg=#0c0d12,bg=#ff2a3a,bold] #I  #W#F #[fg=#ff2a3a,bg=#0c0d12]"

# Formato Derecha: Indicador de Broadcast + Hostname + Reloj Cyberpunk
set -g status-right-length 120
set -g status-right "#{?pane_synchronized,#[bg=#ff4b5c,fg=#0c0d12,bold] 󰓦 BROADCAST ACTIVO #[default] ,}#[fg=#56b6c2,bg=#181922] 󰒋 #H #[fg=#232430,bg=#181922]#[fg=#c678dd,bg=#232430] 󰥔 %H:%M #[fg=#ff2a3a,bg=#232430]#[fg=#0c0d12,bg=#ff2a3a,bold] 󰣇 DEVOPS "

# ------------------------------------------------------------------------------
# 9. GESTOR DE PLUGINS TMUX (TPM) & PERSISTENCIA DE SESIONES
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restauración automática con continuum y guardado de procesos Neovim
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Inicialización asíncrona de TPM (-b) para evitar bloqueos del socket en tmux 3.8+
if "test -f ~/.tmux/plugins/tpm/tpm" "run-shell -b '~/.tmux/plugins/tpm/tpm'"
